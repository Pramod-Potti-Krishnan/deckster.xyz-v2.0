<div data-studio-v4-composer="true" class="p-3 border-t border-gray-100 bg-white transition-colors dark:border-slate-800 dark:bg-slate-900 ">
<input type="file" multiple="" accept=".pdf,.docx,.doc,.txt,.md,.xlsx,.xls,.csv,.pptx,.ppt,.json,.xml,.yaml,.yml,.png,.jpg,.jpeg,.gif,.webp,.py,.js,.ts,.java,.go,.rs" class="hidden"/>
<form>
<div data-studio-v4-prompt="true" class="relative bg-gray-50 rounded-xl border border-gray-200 focus-within:border-gray-300 focus-within:shadow-sm transition-all dark:bg-slate-800 dark:border-slate-700 dark:focus-within:border-slate-600">
<div class="relative" data-studio-composer-prompt="true">
<textarea class="flex rounded-md border-input py-2 ring-offset-background focus-visible:outline-none focus-visible:ring-ring disabled:cursor-not-allowed disabled:opacity-50 md:text-sm w-full resize-none border-0 bg-transparent focus:ring-0 focus-visible:ring-0 focus-visible:ring-offset-0 px-3 pt-3 pb-14 min-h-[96px] max-h-[220px] text-xs placeholder:text-gray-400 overflow-y-auto dark:text-slate-100 dark:placeholder:text-slate-500" aria-label="Message Director" data-studio-v4-type-role="prompt" placeholder="Director is replying… (Esc to type anyway)" rows="1">
</textarea>
</div>
<div data-studio-v4-composer-toolbar="true" class="absolute bottom-0 left-0 right-0 flex items-center justify-between px-3 py-2 bg-gray-50 rounded-b-xl dark:bg-slate-800">
<div class="flex items-center gap-1">
<button type="button" class="flex items-center justify-center rounded-lg p-1.5 text-gray-600 dark:text-slate-300 transition-colors hover:bg-gray-200 dark:hover:bg-slate-700 disabled:cursor-not-allowed disabled:opacity-50" aria-label="Upload a file">
<svg data-icon="Paperclip" class="h-4 w-4">
</svg>
</button>
<button type="button" class="flex items-center justify-center rounded-lg p-1.5 transition-colors text-gray-600 dark:text-slate-300 hover:bg-gray-200 dark:hover:bg-slate-700" aria-label="Build theme">
<svg data-icon="Palette" class="h-4 w-4">
</svg>
</button>
<button type="button" aria-label="Research options" class="p-1.5 rounded-lg hover:bg-gray-200 dark:hover:bg-slate-700 transition-colors">
<svg data-icon="SlidersHorizontal" class="h-4 w-4 text-gray-500 dark:text-slate-400">
</svg>
</button>
</div>
<button data-studio-v4-send="true" aria-label="Send message" type="submit" disabled="" aria-disabled="true" class="h-7 w-7 rounded-lg flex items-center justify-center transition-all bg-purple-100 text-purple-300 dark:bg-slate-700 dark:text-slate-500 cursor-not-allowed">
<svg data-icon="ArrowUp" class="h-4 w-4">
</svg>
</button>
</div>
</div>
</form>
<div data-studio-composer-part="footer">
<span>Director is replying · Esc to continue</span>
</div>
</div>
