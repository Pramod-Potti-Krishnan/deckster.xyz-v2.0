<!-- StudioDirectorHeader -->
<header data-studio-director-header="true" role="group" aria-label="Director conversation">
<span aria-hidden="true">
<svg data-icon="Sparkles" size="13">
</svg>
</span>
<strong>Director</strong>
<span role="status" aria-label="Director connection" aria-atomic="true" data-connection-state="connected">Connected</span>
</header>
<!-- StudioDirectorNotice -->
<section aria-label="Director connection and request updates" data-studio-director-notice="true" class="flex min-w-0 flex-col gap-2 mx-3 mt-2">
<div data-studio-director-transport-notice="auth_refreshed" role="status" aria-atomic="true" class="min-w-0 rounded-md border px-3 py-2 text-xs leading-relaxed" style="min-width:0;max-width:100%;overflow-wrap:anywhere;white-space:pre-wrap;background:var(--ss-panel, #ffffff);color:var(--ss-text, #243438);border-color:var(--ss-line, #dde5e2)">
<p data-studio-director-notice-part="message" style="min-width:0;overflow-wrap:anywhere;white-space:pre-wrap;color:var(--ss-muted, #566965)">Secure connection refreshed.</p>
</div>
</section>
