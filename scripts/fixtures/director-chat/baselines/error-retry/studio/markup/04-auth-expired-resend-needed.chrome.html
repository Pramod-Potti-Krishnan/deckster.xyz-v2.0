<!-- StudioDirectorHeader -->
<header data-studio-director-header="true" role="group" aria-label="Director conversation">
<span aria-hidden="true">
<svg data-icon="Sparkles" size="13">
</svg>
</span>
<strong>Director</strong>
<span role="status" aria-label="Director connection" aria-atomic="true" data-connection-state="connected">Connected</span>
</header>
<!-- StudioDirectorNotice -->
<section aria-label="Director connection and request updates" data-studio-director-notice="true" class="flex min-w-0 flex-col gap-2 mx-3 mt-2">
<div data-studio-director-transport-notice="auth_expired" role="alert" aria-atomic="true" class="min-w-0 rounded-lg border px-3 py-3 text-xs leading-relaxed" style="min-width:0;max-width:100%;overflow-wrap:anywhere;white-space:pre-wrap;background:var(--ss-panel, #ffffff);color:var(--ss-text, #243438);border-color:var(--ss-line, #dde5e2)">
<p class="mb-1 font-semibold" style="color:var(--ss-text, #243438)">Your last input needs to be resent</p>
<p data-studio-director-notice-part="message" style="min-width:0;overflow-wrap:anywhere;white-space:pre-wrap;color:var(--ss-muted, #566965)">Your secure connection expired.</p>
<p data-studio-director-notice-part="resend-guidance" class="mt-2 font-medium">Your last input was discarded when the connection expired. Restore the connection, then use the chat box to resend it yourself.</p>
</div>
</section>
