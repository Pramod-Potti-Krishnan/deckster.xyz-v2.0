<!-- StudioDirectorHeader -->
<header data-studio-director-header="true" role="group" aria-label="Director conversation" data-studio-chat-header="true">
<span aria-hidden="true">
<svg data-icon="Sparkles" size="13">
</svg>
</span>
<strong>Director</strong>
<span role="status" aria-label="Director connection" aria-atomic="true" data-connection-state="disconnected" data-studio-chat-header-state="superseded">Open in another tab</span>
</header>
<!-- StudioDirectorNotice -->

<!-- StudioSupersededNotice -->
<div data-studio-superseded-notice="true" role="status" aria-atomic="true" class="flex min-w-0 flex-col items-start gap-2 rounded-lg border px-3 py-3 text-xs leading-relaxed mx-3 mt-2" style="min-width:0;max-width:100%;overflow-wrap:anywhere;background:var(--ss-panel, #ffffff);color:var(--ss-text, #243438);border-color:var(--ss-line, #dde5e2)">
<p data-studio-superseded-part="text" style="min-width:0;overflow-wrap:anywhere">This session is open in another tab. Changes there are live; this tab is paused.</p>
<button type="button" data-studio-superseded-part="use-here" class="rounded-md border px-2.5 py-1 text-xs font-medium" style="border-color:var(--ss-line, #dde5e2);background:var(--ss-surface, #f6f9f8);color:var(--ss-text, #243438)">Use here</button>
</div>
